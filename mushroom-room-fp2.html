<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Upside-Down Mushroom Room — First-Person Walkthrough</title>
<style>
  :root{
    --ink:#141414;
    --red:#c8401f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e7e3;
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink)}
  canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}

  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
    background:rgba(20,20,20,.40);box-shadow:0 0 0 1.5px rgba(255,255,255,.5);opacity:0;transition:opacity .4s;pointer-events:none;z-index:5}
  body.playing #cross{opacity:1}

  #duck{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:6;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:#3a3632;background:rgba(255,246,232,.82);border:1px solid rgba(0,0,0,.08);
    border-radius:100px;padding:6px 14px;opacity:0;transition:opacity .25s;pointer-events:none;backdrop-filter:blur(6px)}
  #duck.on{opacity:1}

  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#2b2b2b;
    background:rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(0,0,0,.07);border-radius:100px;padding:9px 18px;white-space:nowrap;
    opacity:0;transition:opacity .5s;pointer-events:none}
  body.playing #hint{opacity:1}

  #panel{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 40%,#ffffff 0%,#f1eeea 55%,#e3ddd6 100%);
    transition:opacity .55s ease, visibility .55s}
  #panel.gone{opacity:0;visibility:hidden}
  #panel .wrap{width:min(700px,88vw);text-align:center}
  #panel h1{margin:0 0 14px;font-size:clamp(28px,5.8vw,52px);line-height:1.0;font-weight:800;letter-spacing:-.02em}
  #panel h1 em{font-style:normal;color:var(--red)}
  #panel .sub{margin:0 0 26px;font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;color:#8a8580}
  #panel .rule{width:54px;height:3px;background:var(--red);margin:0 auto 28px;border-radius:2px}
  .keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 26px;margin:0 auto 30px;max-width:470px;text-align:left}
  .k{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#4a4644}
  .k b{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 7px;
    border:1px solid rgba(0,0,0,.16);border-radius:6px;background:#fff;font-weight:600;font-size:11px;
    box-shadow:0 1px 0 rgba(0,0,0,.06)}
  #enter{appearance:none;border:0;cursor:pointer;background:var(--ink);color:#fff;font:inherit;font-size:12.5px;
    letter-spacing:.14em;text-transform:uppercase;padding:16px 40px;border-radius:100px;transition:transform .18s, background .18s}
  #enter:hover{background:var(--red);transform:translateY(-1px)}
  #panel .tiny{margin:18px 0 0;font-size:11px;color:#9d9893}
  .cred{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:#b3ada6;z-index:21}
  #panel.gone + .cred{opacity:0;transition:opacity .4s}

  #load{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#f2efec;
    font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:#8d8882;transition:opacity .5s}
  #load.gone{opacity:0;pointer-events:none}
  #load span{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  #stick{position:fixed;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;
    border:1.5px solid rgba(0,0,0,.16);background:rgba(255,255,255,.22);pointer-events:none;opacity:0;z-index:7;transition:opacity .2s}
  #knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
    background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.12);box-shadow:0 2px 10px rgba(0,0,0,.12)}
  #tlook{position:fixed;inset:0;z-index:4;display:none}
  body.touch #tlook{display:block}
  body.touch #hint{font-size:10px;padding:8px 14px}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="tlook"></div>
<div id="cross"></div>
<div id="stick"><div id="knob"></div></div>
<div id="duck">ducking</div>
<div id="hint">W A S D walk · mouse look · C duck · shift run · esc release</div>

<div id="panel">
  <div class="wrap">
    <h1>Carsten Höller<br><em>Upside&ndash;Down</em> Mushroom Room</h1>
    <p class="sub">Fondazione Prada, Milan &nbsp;·&nbsp; first-person walkthrough</p>
    <div class="rule"></div>
    <div class="keys" id="keys"></div>
    <button id="enter">Enter the gallery</button>
    <p class="tiny" id="tiny">The mature caps hang low. You will have to duck.</p>
  </div>
</div>
<div class="cred">procedural reconstruction &nbsp;·&nbsp; three.js</div>

<div id="load"><span>building the room…</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';

/* ============================================================
   0.  DEVICE / QUALITY            (reference: Fondazione Prada
       installation — 14 × 7 × 4.6 m gallery envelope)
   ============================================================ */
const IS_TOUCH  = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
const Q         = IS_TOUCH ? 0.45 : 1;      // geometry density multiplier
const USE_BLOOM = !IS_TOUCH;
document.body.classList.toggle('touch', IS_TOUCH);

/* ============================================================
   1.  UTILITIES
   ============================================================ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng  = mulberry32(20000911);
const rand = (a, b) => a + rng() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

function noise2(x, y, s){
  return 0.55 * Math.sin(x * 1.7 + y * 0.8 + s)
       + 0.30 * Math.sin(x * 3.3 - y * 2.1 + s * 1.7)
       + 0.15 * Math.sin(x * 6.1 + y * 4.7 + s * 2.9);
}

/* Surface of revolution.  profile = [{x:radius, y:height}], height increasing.
   Normals point outward.  UV: u = around the axis, v = normalised arc length. */
function revolve(profile, segs, uvV){
  const n = profile.length;
  const verts = [], uvs = [], idx = [];
  const arc = [0];
  for (let j = 1; j < n; j++)
    arc[j] = arc[j-1] + Math.hypot(profile[j].x - profile[j-1].x, profile[j].y - profile[j-1].y);
  const total = arc[n-1] || 1;
  for (let j = 0; j < n; j++){
    const p = profile[j];
    const v = uvV ? uvV[j] : arc[j] / total;
    for (let i = 0; i <= segs; i++){
      const th = i / segs * Math.PI * 2;
      verts.push(p.x * Math.sin(th), p.y, p.x * Math.cos(th));
      uvs.push(i / segs, v);
    }
  }
  for (let j = 0; j < n - 1; j++){
    for (let i = 0; i < segs; i++){
      const a = j * (segs + 1) + i, b = a + 1, c = a + segs + 1, d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  /* The seam column is duplicated (i = 0 and i = segs share a position), so
     computeVertexNormals gives each a one-sided normal and every revolved
     surface shows a visible crease down the seam.  Average them. */
  {
    const nr = g.attributes.normal, row = segs + 1;
    for (let j = 0; j < n; j++){
      const a = j * row, b = a + segs;
      const nx = nr.getX(a) + nr.getX(b), ny = nr.getY(a) + nr.getY(b), nz = nr.getZ(a) + nr.getZ(b);
      const L = Math.hypot(nx, ny, nz) || 1;
      nr.setXYZ(a, nx / L, ny / L, nz / L);
      nr.setXYZ(b, nx / L, ny / L, nz / L);
    }
    nr.needsUpdate = true;
  }
  return g;
}

/* ============================================================
   2.  ROOM ENVELOPE  —  14 m long × 7 m wide × 4.6 m high
   ============================================================ */
const ROOM = { w: 14, d: 7, h: 4.6 };

/* ============================================================
   3.  RENDERER / SCENE / CAMERA   (24 mm full-frame → 74° hfov)
   ============================================================ */
const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: !IS_TOUCH, powerPreference: 'high-performance' });
} catch(e){
  document.getElementById('load').innerHTML = '<span>WebGL is unavailable in this browser</span>';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
/* The key is at floor level, so every shadow in this room is thrown UPWARD
   onto the ceiling and walls.  That inverted shadow direction is a large part
   of the installation's character and is worth the shadow-map cost. */
renderer.shadowMap.enabled = !IS_TOUCH;      // no casters on touch — don't compile the permutation
renderer.shadowMap.type = THREE.VSMShadowMap; // the only type where shadow.radius actually blurs
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe0dd);
scene.fog = new THREE.FogExp2(0xf0ded4, 0.014);   // warm floor-bounce, not neutral haze

const HFOV = 74;                                 // ≈24 mm on a 36 mm sensor
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.04, 90);
camera.rotation.order = 'YXZ';
function applyFov(){
  const a = camera.aspect;
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(HFOV) / 2) / a));
  camera.updateProjectionMatrix();
}
applyFov();

/* IBL is kept low: the installation is keyed from the floor, so almost
   no light should arrive from above. */
try {
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
  pmrem.dispose();
  if ('environmentIntensity' in scene) scene.environmentIntensity = 0.22;
} catch(e){ /* non fatal */ }

/* ============================================================
   4.  ROOM SHELL
       walls: matte white plaster · ceiling: desaturated blue-grey slate
   ============================================================ */
const M_WALL   = new THREE.MeshStandardMaterial({ color: 0xefede7, roughness: 0.96, metalness: 0 });
const M_CEIL   = new THREE.MeshStandardMaterial({ color: 0x8d979f, roughness: 1.0,  metalness: 0 }); // slate
const M_FLOOR  = new THREE.MeshStandardMaterial({ color: 0xf3f1ec, roughness: 0.30, metalness: 0 }); // polished

const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), M_FLOOR);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), M_CEIL);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = ROOM.h;
ceiling.receiveShadow = true;                 // catches the upward shadows
scene.add(ceiling);

function wall(x, z, ry, span){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(span, ROOM.h), M_WALL);
  m.position.set(x, ROOM.h / 2, z);
  m.rotation.y = ry;
  m.receiveShadow = true;
  scene.add(m);
}
wall(0, -ROOM.d/2, 0, ROOM.w);
wall(0,  ROOM.d/2, Math.PI, ROOM.w);
wall(-ROOM.w/2, 0,  Math.PI/2, ROOM.d);
wall( ROOM.w/2, 0, -Math.PI/2, ROOM.d);

/* ============================================================
   5.  FLOOR LUMINAIRE SLITS
       11 flush transverse slots (0.16 × 2.60 m) set perpendicular to
       the room's length, leaving a clean border of floor each side.
       These are the PRIMARY KEY of the whole installation.
   ============================================================ */
const SLITS_X = [];
const stripMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0xfff6ea, emissiveIntensity: 3.1, roughness: 1, metalness: 0
});
{
  const g = new THREE.PlaneGeometry(0.16, 2.60);   // x narrow, z long → transverse
  const n = 11;
  for (let i = 0; i < n; i++){
    const x = -5.5 + i * 1.1;
    SLITS_X.push(x);
    const s = new THREE.Mesh(g, stripMat);
    s.rotation.x = -Math.PI / 2;
    s.rotation.z = Math.PI / 2;                       // long axis across the width
    s.position.set(x, 0.008, 0);
    scene.add(s);
  }
}

/* ============================================================
   6.  MUSHROOM SHADERS
   ============================================================ */

/* ---- the universal veil as ONE cracked crust ----------------------------
   Not scattered warts.  A single crust thresholded from a noise field, whose
   coverage and feature size differ per developmental stage:
     dense fine dotting -> tangential labyrinthine ridges -> isolated plaques.
   The reference (crops/D_crustbutton_03.jpg) shows sinuous CIRCUMFERENTIAL
   ridges with red in the gaps, solid at the rim, widest gaps mid-cap.
   Thresholds were calibrated by bisection to hit the target coverage; note
   coverage is NOT monotonic with age — the smallest buttons are red with ~38%
   fine white dotting, and no fully-white stage exists in the reference. */
const CRUST = {
  peppercorn: { cov: 0.38, scale: 3.40, tang: 0.12 },
  button:     { cov: 0.52, scale: 2.20, tang: 0.35 },
  labyrinth:  { cov: 0.50, scale: 1.30, tang: 0.72 },
  expanding:  { cov: 0.28, scale: 1.25, tang: 0.45 },
  mature:     { cov: 0.15, scale: 1.45, tang: 0.12 }
};

/* Angular noise that CLOSES around the cap.  noise2's internal multipliers
   (1.7 / 3.3 / 6.1) are irrational with respect to 2*pi, so feeding it an
   angle leaves a visible discontinuity at the revolve seam.  Integer
   harmonics of theta are periodic by construction. */
function pnoise(th, y, s, F){
  return 0.55 * Math.sin(F * th + y * 0.8 + s)
       + 0.30 * Math.sin(2 * F * th - y * 2.1 + s * 1.7)
       + 0.15 * Math.sin(4 * F * th + y * 4.7 + s * 2.9);
}
const HF = n => Math.max(1, Math.round(n));

/* t = 0 at the cap apex, 1 at the margin.  Signed; above the stage threshold
   is crust.  Tangential ring term + island noise, the ring warped hard in
   theta so it breaks into sinuous arcs instead of perfect concentric circles. */
function crustField(th, t, p, seed){
  const bands = (5.5 + 5.5 * t) * Math.max(0.55, p.scale * 0.75);
  const warp  = 3.1 * pnoise(th, t * 2.2, seed, HF(4.5))
              + 1.5 * pnoise(th, t * 4.4, seed + 7, HF(9.1));
  const ring  = Math.sin(t * Math.PI * bands + warp);
  const k = p.scale;
  const isle = 0.62 * pnoise(th, t * 4.2 * k,  seed + 11, HF(2.6 * k))
             + 0.30 * pnoise(th, t * 9.1 * k,  seed + 29, HF(5.9 * k))
             + 0.14 * pnoise(th, t * 17.7 * k, seed + 53, HF(11.3 * k));
  const field = p.tang * 0.80 * ring + (1 - 0.40 * p.tang) * isle;
  const belt  = 0.94 + 0.13 * Math.sin(Math.PI * Math.pow(t, 0.8));  // gaps widest mid-cap
  return field / belt;
}

/* Solve the threshold from the target coverage instead of hard-coding it:
   the quantile is exact, survives any change to the field, and the plaque
   placement reads back the same number the texture was painted with. */
const CRUST_GRID = {};
function crustGrid(stage, seed){
  if (CRUST_GRID[stage]) return CRUST_GRID[stage];
  const p = CRUST[stage], GW = 768, GH = 384;
  const f = new Float32Array(GW * GH);
  for (let y = 0; y < GH; y++){
    const t = y / (GH - 1);
    for (let x = 0; x < GW; x++) f[y * GW + x] = crustField(x / GW * Math.PI * 2, t, p, seed);
  }
  const sorted = Float32Array.from(f).sort();
  const thr = sorted[Math.floor((1 - p.cov) * (sorted.length - 1))];
  return (CRUST_GRID[stage] = { f, GW, GH, thr, p, seed });
}

/* ---- the cap strip, painted along v across the whole lens cross-section ----
   v 0            red apex (hangs lowest, faces the floor)
   v 0-.70        red skin: hot orange-scarlet, heavy low-frequency mottling
   v .70-.765     skin deepens to crimson approaching the rim
   v .765-.775    a thin HARD DARK LINE — the crispest edge on the sculpture
   v .775-.84     pale cream lip
   v .84-1        gill-side flesh, mauve-tinted (mostly hidden by lamellae)
   The four-band margin is what the eye actually reads at duck height, and no
   amount of geometry substitutes for it. */
function makeCapTexture(seed, crimson = 0, crustP = null){
  const w = 1024, h = 512;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const R = mulberry32(seed | 0), rr = (a, b) => a + R() * (b - a);
  const yFor = v => (1 - v) * h;                 // flipY: canvas top row is v = 1

  // young fruit bodies sit deeper/bluer red, mature ones hotter and oranger
  const base = crimson > 0.5 ? '#b01c15' : '#d32a18';
  g.fillStyle = base; g.fillRect(0, yFor(0.80), w, h);

  // low-frequency pigment mottling — the reference red is never flat
  for (let i = 0; i < 340; i++){
    const x = R() * w, y = yFor(0.80) + R() * (h - yFor(0.80)), rad = rr(40, 190);
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    /* These blobs overlap ~34 deep, so a 'subtle' orange at 15 deg hue stacks
       into rust.  The base is already a correct 6 deg scarlet — it was never
       the problem.  Fewer hot blobs, and nearer red than orange. */
    const hot = R() > 0.75;
    gr.addColorStop(0, hot ? `rgba(208,58,26,${rr(0.06,0.14)})`
                           : `rgba(146,24,16,${rr(0.10,0.26)})`);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, 6.2832); g.fill();
  }
  // mild orange lift toward the margin
  const om = g.createLinearGradient(0, yFor(0.72), 0, yFor(0.58));
  om.addColorStop(0, 'rgba(243,116,34,0.25)');
  om.addColorStop(1, 'rgba(243,116,34,0.00)');
  g.fillStyle = om; g.fillRect(0, yFor(0.72), w, yFor(0.58) - yFor(0.72));
  // crimson deepening right at the rim
  const dm = g.createLinearGradient(0, yFor(0.760), 0, yFor(0.705));
  dm.addColorStop(0, 'rgba(138,26,18,0.32)');
  dm.addColorStop(1, 'rgba(138,26,18,0.00)');
  g.fillStyle = dm; g.fillRect(0, yFor(0.760), w, yFor(0.705) - yFor(0.760));

  // coarse granular substrate — the reference skin has visible orange-peel tooth
  for (let i = 0; i < 9000; i++){
    const x = R() * w, y = yFor(0.80) + R() * (h - yFor(0.80));
    const v = 1 - y / h;
    const up = R() > 0.5;
    // fade the warm grain out past v .65 so it stops cancelling the rim darkening
    const k = up ? clamp((0.72 - v) / 0.07, 0, 1) : 1;
    if (k <= 0) continue;
    g.fillStyle = up ? `rgba(224,92,46,${rr(0.02,0.05) * k})` : `rgba(108,16,12,${rr(0.03,0.12)})`;
    g.fillRect(x, y, rr(1, 3), rr(1, 3));
  }

  // fine hairline striations, marginal zone only
  for (let i = 0; i < 1400; i++){
    const x = R() * w, y0 = yFor(0.70);
    g.strokeStyle = `rgba(122,26,16,${rr(0.04, 0.13)})`;
    g.lineWidth = rr(0.7, 1.8);
    g.beginPath(); g.moveTo(x, y0); g.lineTo(x + rr(-2, 2), y0 - rr(0.02, 0.06) * h); g.stroke();
  }

  g.fillStyle = '#2a1008'; g.fillRect(0, yFor(0.778), w, yFor(0.760) - yFor(0.778)); // dark line: ~9px, survives mips
  g.fillStyle = '#e8dcc4'; g.fillRect(0, yFor(0.832), w, yFor(0.778) - yFor(0.832)); // cream lip
  g.fillStyle = '#c8bcbe'; g.fillRect(0, 0, w, yFor(0.832));                          // mauve flesh

  // the lip and flesh are cast plaster, not clean paint
  for (let i = 0; i < 900; i++){
    const x = R() * w, y = R() * yFor(0.778);
    g.fillStyle = `rgba(${R()>0.5?120:250},${R()>0.5?110:242},${R()>0.5?112:228},${rr(0.05,0.22)})`;
    g.fillRect(x, y, rr(1, 4), rr(1, 3));
  }
  /* --- lay the veil crust over the red skin (v 0 .. .70 == apex .. margin) ---
     Evaluated on a coarse grid and scaled up: a per-pixel evaluation is ~16
     sines per texel and would cost seconds at page load. */
  const bc = document.createElement('canvas'); bc.width = w; bc.height = h;
  const bg2 = bc.getContext('2d');
  bg2.fillStyle = '#808080'; bg2.fillRect(0, 0, w, h);          // neutral = no relief
  if (crustP){
    const { f, GW, GH, thr } = crustP;
    const col = document.createElement('canvas'); col.width = GW; col.height = GH;
    const bmp = document.createElement('canvas'); bmp.width = GW; bmp.height = GH;
    const cx2 = col.getContext('2d'), bx2 = bmp.getContext('2d');
    const ci = cx2.createImageData(GW, GH), bi = bx2.createImageData(GW, GH);
    for (let yy = 0; yy < GH; yy++){
      const t01 = yy / (GH - 1);
      for (let xx = 0; xx < GW; xx++){
        const i4 = (yy * GW + xx) * 4;
        const e  = clamp((f[yy * GW + xx] - thr) / 0.045, 0, 1);   // narrow shoulder: crisp edge
        ci.data[i4 + 3] = Math.round(255 * e);
        let hsh = (xx * 374761393 + yy * 668265263) | 0;
        hsh = (hsh ^ (hsh >> 13)) * 1274126177 | 0;
        const spk = 0.80 + 0.20 * (((hsh ^ (hsh >> 16)) >>> 0) / 4294967296);
        ci.data[i4]     = Math.round(214 * spk);
        ci.data[i4 + 1] = Math.round(204 * spk);
        ci.data[i4 + 2] = Math.round(184 * spk);
        const v = 118 + 120 * e;
        bi.data[i4] = bi.data[i4 + 1] = bi.data[i4 + 2] = v; bi.data[i4 + 3] = 255;
      }
    }
    cx2.putImageData(ci, 0, 0); bx2.putImageData(bi, 0, 0);
    g.imageSmoothingEnabled = true; bg2.imageSmoothingEnabled = true;
    g.drawImage(col, 0, yFor(0.70), w, yFor(0) - yFor(0.70));
    bg2.drawImage(bmp, 0, yFor(0.70), w, yFor(0) - yFor(0.70));
  }

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const b = new THREE.CanvasTexture(bc);
  b.wrapS = THREE.RepeatWrapping; b.wrapT = THREE.ClampToEdgeWrapping;
  b.anisotropy = t.anisotropy;
  return { map: t, bump: b };
}

const CAP_MATS = {};
/* One material per developmental stage: the crust is baked into the map, so
   the stage — not a random variant index — is what distinguishes them. */
function capMaterial(stage, crimson){
  if (!CAP_MATS[stage]){
    const tex = makeCapTexture(9001 + stage.length * 7717, crimson,
                               CRUST[stage] ? crustGrid(stage, 3.7) : null);
    CAP_MATS[stage] = new THREE.MeshPhysicalMaterial({
      map: tex.map, bumpMap: tex.bump, bumpScale: 0.9, color: 0xffffff,
      roughness: 0.60, metalness: 0.0, clearcoat: 0.18, clearcoatRoughness: 0.40,
      side: THREE.DoubleSide
    });
  }
  return CAP_MATS[stage];
}

const MAT = {
  /* semi-gloss satin + a faint coat, per the sculpture's finish */
  /* chalky, near-zero specular, warm ivory — the universal-veil warts */
  wart : new THREE.MeshStandardMaterial({ color: 0xd8cdb6, roughness: 1.0, metalness: 0 }),
  /* thin, translucent lamellae: a touch of self-illumination fakes the SSS
     glow as the floor light is transmitted through the tissue */
  gill : new THREE.MeshStandardMaterial({
    color: 0xc9b6bb, roughness: 0.78, metalness: 0, side: THREE.DoubleSide,
    emissive: 0x3d2a30, emissiveIntensity: 0.34
  }),
  stem : new THREE.MeshStandardMaterial({ color: 0xe7e0d3, roughness: 0.88, metalness: 0, side: THREE.DoubleSide }),
  veil : new THREE.MeshStandardMaterial({ color: 0xe9e1d1, roughness: 0.90, metalness: 0, side: THREE.DoubleSide }),
  volva: new THREE.MeshStandardMaterial({ color: 0xe3dccb, roughness: 0.97, metalness: 0 }),
  body : new THREE.MeshStandardMaterial({ color: 0x1c1c22, roughness: 0.52, metalness: 0.06 })
};

/* ============================================================
   7.  MUSHROOM BUILDER
       The sculptures hang stipe-upwards from the ceiling: the cap's
       convex red surface faces the floor, the gills face the ceiling.
       Local frame: y = 0 at the ceiling, y = -stemH at the cap rim.
   ============================================================ */
/* The pileus is a BICONVEX LENS, not a shell.  Rim at y = 0.
   The red skin bulges DOWN to -H; the gill-side envelope bulges UP to +T with
   a flatter, flat-topped profile (reference: crops/E_capedge_05.jpg, where the
   silhouette gap is widest at the stipe and closes to a knife edge at the rim).
   The earlier code offset the gill surface a constant distance inside the red
   bowl, so both faces bulged the same way — the single biggest form error.

   `lens` is one closed profile running red-apex -> margin -> gill-apex, with
   explicit uvV so the cap texture can paint the four-band margin along v.
   Direct analogue of cap_geometry() in blender-mushroom-room.py. */
function capGeometry(R, H, rings = 22, gillRise = 0.48, gillFlat = 2.8){
  const y0     = (R * R - H * H) / (2 * H);     // sphere centre, above the rim
  const Rs     = y0 + H;
  const phiMax = Math.atan2(R, y0);
  const T      = H * gillRise;                  // how far the gill dome rises

  const red = [];                               // apex -> margin
  for (let j = 0; j <= rings; j++){
    const phi = phiMax * (j / rings);
    red.push(new THREE.Vector2(Rs * Math.sin(phi), y0 - Rs * Math.cos(phi)));
  }
  const gillY = t => T * (1 - Math.pow(t, gillFlat));
  const gill = [];                              // margin -> apex
  for (let j = rings; j >= 0; j--) gill.push(new THREE.Vector2(R * (j / rings), gillY(j / rings)));

  // closed lens: drop the shared margin point from each face, bridge with a rim roll
  const lipH = Math.max(0.012, R * 0.014);
  const lens = red.slice(0, rings).concat([
    new THREE.Vector2(R * 0.998, -lipH * 0.45),
    new THREE.Vector2(R,          0),
    new THREE.Vector2(R * 0.998,  lipH * 0.45)
  ], gill.slice(1));

  /* v bands: 0-.70 red skin | .70-.80 the rim roll | .80-1 gill-side flesh */
  const uvV = [];
  let arc = 0; const redLen = [];
  for (let j = 0; j < rings; j++){
    if (j) arc += red[j].distanceTo(red[j - 1]);
    redLen.push(arc);
  }
  const redTot = redLen[redLen.length - 1] || 1;
  redLen.forEach(a => uvV.push(0.70 * a / redTot));
  uvV.push(0.722, 0.760, 0.800);
  for (let j = 1; j <= rings; j++) uvV.push(0.82 + 0.18 * ((j - 1) / (rings - 1)));

  return { lens, uvV, red, gill, gillY, y0, Rs, phiMax, T };
}

/* Break the surface of revolution.  A perfectly circular rim is the loudest
   tell that a cap was revolved; every cap in the photographs is lobed and its
   margin rises and falls.  Weighted by (r/R)^1.5 so the stipe attachment at the
   centre stays put and the margin moves most. */
function shapeCap(geo, R, lobe, undulate){
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++){
    const px = p.getX(i), py = p.getY(i), pz = p.getZ(i);
    const rr = Math.hypot(px, pz); if (rr < 1e-5) continue;
    const th = Math.atan2(px, pz);
    const w  = Math.pow(clamp(rr / R, 0, 1), 1.5);
    const sc = 1 + (lobe(th) - 1) * w;
    p.setX(i, px * sc); p.setZ(i, pz * sc);
    p.setY(i, py + undulate(th) * w);
  }
  geo.computeVertexNormals();
}

const WART_GEO = (() => {
  /* Top radius > base radius gives the UNDERCUT seen at full resolution in
     crops/V3_annulus_06.jpg — the plaque overhangs the skin and casts a hard
     line at its edge.  Flat-topped, not conical. */
  const g = new THREE.CylinderGeometry(1.0, 0.78, 1, 9, 1);
  g.translate(0, 0.5, 0);
  return g;
})();

function makeMushroom(cfg){
  const { x, z, capR, capH, stemH, stemR, bend = 0, tiltX = 0, tiltZ = 0,
          gillRise = 0.48 } = cfg;
  const grp = new THREE.Group();
  grp.position.set(x, ROOM.h, z);
  grp.rotation.set(tiltX, rand(0, Math.PI * 2), tiltZ);

  const phase = rand(0, 20);
  const rimY  = -stemH;

  /* --- per-specimen margin identity: no two caps share an outline --- */
  const LOBES  = 9 + Math.floor(rng() * 4);             // 9-12 lobes
  const lobeA  = 0.030 + rng() * 0.020;                 // 3-5% of the radius
  const lobePh = rand(0, Math.PI * 2), undPh = rand(0, Math.PI * 2);
  /* The reference caps are not sine waves: each has ONE dominant asymmetric
     bite out of the margin, plus gentle rolling. */
  const notchTh = rand(0, Math.PI * 2);
  const notchW  = 0.26 + rng() * 0.24, notchD = 0.028 + rng() * 0.026;
  const angD = (a, b) => { const d = Math.abs(a - b) % (Math.PI * 2);
                           return d > Math.PI ? Math.PI * 2 - d : d; };
  const lobe = th => 1 + lobeA * Math.sin(th * LOBES + lobePh)
                       + 0.40 * lobeA * noise2(th * 2.2, 0, phase)
                       - notchD * Math.exp(-Math.pow(angD(th, notchTh) / notchW, 2));
  const undulate = th => capR * 0.022 * lobeA / 0.04
                       * Math.sin(th * LOBES * 0.5 + undPh);

  /* --- stipe: curved, fibrous, swollen volva at the ceiling --- */
  const NS = Math.max(16, Math.round(34 * Q));
  const stemProfile = [];
  for (let j = 0; j <= NS; j++){
    const u = 1 - j / NS;                                  // 1 = cap end
    const y = -stemH * u;
    let r = stemR * (0.78 + 1.15 * Math.exp(-u * 4.6) + 0.09 * Math.sin(u * 7.0));
    r *= 1 + 0.30 * Math.exp(-Math.pow((u - 1) / 0.085, 2)); // flare into the gills
    stemProfile.push(new THREE.Vector2(r, y));
  }
  const stemGeo = revolve(stemProfile, Math.max(16, Math.round(64 * Q)));
  {
    const p = stemGeo.attributes.position;
    for (let i = 0; i < p.count; i++){
      const px = p.getX(i), py = p.getY(i), pz = p.getZ(i);
      const rr = Math.hypot(px, pz); if (rr < 1e-5) continue;
      const th = Math.atan2(px, pz);
      const u  = clamp(-py / stemH, 0, 1);
      const n  = noise2(th * 2.3, py * 1.5, phase);
      const sc = 1 + 0.075 * n;
      // organic curvature: the stipe leans as it descends
      const dx = bend * u * u, dz = bend * 0.35 * u * u;
      p.setX(i, px * sc + dx); p.setZ(i, pz * sc + dz);
      p.setY(i, py + 0.030 * n);
    }
    stemGeo.computeVertexNormals();
  }
  const capOffset = new THREE.Vector3(bend, 0, bend * 0.35);

  /* --- pileus: one closed biconvex lens --- */
  const capSegs = clamp(Math.round(capR * 340 * Q), 128, 880);
  const CG = capGeometry(capR, capH, 22, gillRise);
  const capGeo = revolve(CG.lens, capSegs, CG.uvV);
  shapeCap(capGeo, capR, lobe, undulate);
  const { y0, Rs, phiMax } = CG;      // the red underside still drives clearance

  /* --- hymenium: rides the gill-side dome, NOT an offset of the red bowl.
     Still the Phase-1 corrugated surface; Phase 5 replaces it with blades. --- */
  const rIn   = Math.max(0.045, stemR * 1.02);
  const tIn   = clamp(rIn / capR, 0.04, 0.5);
  const gInset = 0.012 + capR * 0.010;            // sits just under the flesh
  const NG    = Math.max(14, Math.round(22 * Q));
  const gProf = [];
  for (let j = 0; j <= NG; j++){
    const t = tIn + (0.965 - tIn) * (j / NG);     // stop short so the lip shows
    gProf.push(new THREE.Vector2(capR * t, CG.gillY(t) - gInset));
  }
  const gillGeo = revolve(gProf, capSegs);
  const FINS = Math.max(60, Math.round(capSegs / 3));
  const amp  = Math.min(0.030, 0.005 + capR * 0.0065);
  {
    const p = gillGeo.attributes.position;
    for (let i = 0; i < p.count; i++){
      const px = p.getX(i), py = p.getY(i), pz = p.getZ(i);
      const rr = Math.hypot(px, pz); if (rr < 1e-4) continue;
      const th = Math.atan2(px, pz);
      const finIndex = Math.floor(((th / (Math.PI * 2)) % 1 + 1) % 1 * FINS);
      const isLong   = (finIndex % 2) === 0;
      const fade = isLong ? 1 : clamp((rr - rIn) / ((capR - rIn) * 0.36), 0, 1);
      const d = amp * (isLong ? 1 : 0.62) * fade * Math.sin(th * FINS);
      const L = lobe(th), w = Math.pow(clamp(rr / capR, 0, 1), 1.5);
      const sc = 1 + (L - 1) * w;
      p.setX(i, (px + d * px / rr) * sc);
      p.setZ(i, (pz + d * pz / rr) * sc);
      p.setY(i, py + d * 0.30 + undulate(th) * w);
    }
    gillGeo.computeVertexNormals();
  }

  /* --- veil plaques: silhouette relief on top of the baked crust.  Placed by
         REJECTION SAMPLING the same field the texture uses, so the geometry
         and the painted pattern agree instead of being two unrelated scatters. --- */
  const CG2 = crustGrid(cfg.crustStage || 'mature', 3.7);
  const cp = CG2.p;
  const wantW = Math.round(rand(40, 70) * Math.min(1.8, capR / 0.9) * (0.35 + cp.cov));
  const wPos = [];
  for (let guard = 0; guard < wantW * 40 && wPos.length < wantW; guard++){
    const t  = Math.pow(rng(), 0.75);              // slight bias outward
    const th = rng() * Math.PI * 2;
    // only well inside a plaque, so geometry and painted pattern agree
    if (crustField(th, t, cp, CG2.seed) < CG2.thr + 0.05) continue;
    wPos.push([th, t]);
  }
  const nWarts = Math.max(1, wPos.length);
  const warts = new THREE.InstancedMesh(WART_GEO, MAT.wart, nWarts);
  {
    const mtx = new THREE.Matrix4(), q = new THREE.Quaternion();
    const up = new THREE.Vector3(0, 1, 0), sc = new THREE.Vector3(), pos = new THREE.Vector3();
    for (let i = 0; i < nWarts; i++){
      const [th, t] = wPos[i] || [rng() * Math.PI * 2, rng()];
      const phi = phiMax * t;
      const r = Rs * Math.sin(phi), yy = y0 - Rs * Math.cos(phi);
      const n = new THREE.Vector3(Math.sin(phi) * Math.sin(th), -Math.cos(phi),
                                  Math.sin(phi) * Math.cos(th)).normalize();
      const L = lobe(th), w = Math.pow(clamp(r / capR, 0, 1), 1.5);
      const rs = 1 + (L - 1) * w;
      pos.set(r * Math.sin(th) * rs, yy + undulate(th) * w, r * Math.cos(th) * rs)
         .addScaledVector(n, -0.004);
      q.setFromUnitVectors(up, n.clone().negate());   // outward = downward off the red skin
      q.multiply(new THREE.Quaternion().setFromAxisAngle(up, rng() * Math.PI * 2));
      // flat plaques: relief ~12% of the plaque's own width
      const sw = capR * rand(0.020, 0.052) * (0.8 + 0.5 / Math.max(0.7, cp.scale));
      sc.set(sw * rand(0.8, 1.3), sw * rand(0.10, 0.16), sw * rand(0.8, 1.3));
      mtx.compose(pos, q, sc);
      warts.setMatrixAt(i, mtx);
    }
    warts.instanceMatrix.needsUpdate = true;
  }

  /* --- partial veil (annulus): a drooping skirt around the stipe.
         Sculpted in the inverted pose, so it hangs DOWN toward the cap. --- */
  const veilProfile = [];
  if (capR > 0.45){
    for (let j = 0; j <= 9; j++){
      const u = j / 9;
      veilProfile.push(new THREE.Vector2(
        stemR * (2.05 - 0.95 * u),
        -stemH * (0.74 - 0.10 * u) - 0.02 * Math.sin(u * Math.PI)
      ));
    }
  }
  let veilGeo = null;
  if (veilProfile.length){
    veilGeo = revolve(veilProfile, Math.max(24, Math.round(capSegs / 4)));
    const p = veilGeo.attributes.position;
    for (let i = 0; i < p.count; i++){
      const px = p.getX(i), py = p.getY(i), pz = p.getZ(i);
      const rr = Math.hypot(px, pz); if (rr < 1e-4) continue;
      const th = Math.atan2(px, pz);
      const w = 1 + 0.05 * Math.sin(th * 9 + phase);
      p.setX(i, px * w); p.setZ(i, pz * w);
      p.setY(i, py + 0.02 * Math.sin(th * 9 + phase));
    }
    veilGeo.computeVertexNormals();
  }

  /* --- swollen volva + rough plaster collar at the ceiling --- */
  const collarProfile = [];
  for (let j = 0; j <= 12; j++){
    const u = j / 12;
    collarProfile.push(new THREE.Vector2(
      stemR * (2.55 - 1.15 * u) * (1 + 0.07 * Math.sin(u * 19 + phase)),
      -0.62 * u - 0.06 * Math.sin(u * 5)
    ));
  }
  const collarGeo = revolve(collarProfile, Math.max(20, Math.round(52 * Q)));

  /* --- assemble (cap + gills ride the stipe's curvature) --- */
  const stemMesh   = new THREE.Mesh(stemGeo, MAT.stem);
  const capMesh    = new THREE.Mesh(capGeo, capMaterial(cfg.crustStage || 'mature', cfg.crimson || 0));
  const gillMesh   = new THREE.Mesh(gillGeo, MAT.gill);
  const collarMesh = new THREE.Mesh(collarGeo, MAT.volva);
  capMesh.position.copy(capOffset);  capMesh.position.y  += rimY;
  gillMesh.position.copy(capOffset); gillMesh.position.y += rimY;
  warts.position.copy(capOffset);    warts.position.y    += rimY;
  grp.add(stemMesh, capMesh, gillMesh, warts, collarMesh);
  if (veilGeo){
    const veil = new THREE.Mesh(veilGeo, MAT.veil);
    veil.position.copy(capOffset);
    grp.add(veil);
  }
  grp.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  // warts are 1-3 cm on a 2048 map spanning ~10 m — unresolvable. GTAO seats them instead.
  warts.castShadow = false;

  const rimWorld = ROOM.h - stemH;

  return {
    group: grp,
    /* solid stipe — "stand closely between stems" */
    stemCollider: rimWorld < 2.7
      ? { x: x + bend, z: z + bend * 0.35, r: stemR * 1.30 + 0.10 }
      : null,
    /* the underside of the cap: drives the auto-duck clearance test */
    dome: { x: x + bend, z: z + bend * 0.35, rimY: rimWorld, capH, capR, y0, Rs, phiMax }
  };
}

/* ============================================================
   8.  THE INSTALLATION
       Four developmental stages.  Buttons stay tucked near the
       ceiling; mature cap rims hang at ~1.6 m and the apex at ~1.0 m.
   ============================================================ */
/* h = red-skin depth as a fraction of capR; gr = how far the gill dome rises
   as a fraction of that depth.  Total thickness / width for `mature` is
   (0.30 + 0.30*0.45) / 2 = 22%, against ~33% before — the earlier caps were
   half again too fat for their width (reference: crops/E_capedge_05.jpg). */
const S = {                                     // stage → proportions
  button        : { h: 1.10, r: 0.30, gr: 0.85, crimson: 1, crust: 'peppercorn' },
  hemispherical : { h: 0.62, r: 0.26, gr: 0.62, crimson: 1, crust: 'labyrinth'  },
  convex        : { h: 0.40, r: 0.27, gr: 0.52, crimson: 0, crust: 'expanding'  },
  mature        : { h: 0.30, r: 0.29, gr: 0.45, crimson: 0, crust: 'mature'     }
};

const PLAN = [
  //  x      z      capR   stemH  stage            bend   tiltX  tiltZ
  [-5.20, -1.78, 1.40, 2.96, 'mature',        0.16, -0.05,  0.00],
  [ 1.50, -1.78, 1.40, 2.99, 'mature',       -0.13,  0.04,  0.03],
  [-1.90, -1.78, 1.15, 2.74, 'convex',        0.11,  0.02, -0.03],
  [ 4.90, -1.78, 0.72, 2.42, 'hemispherical',-0.06,  0.06,  0.00],
  [-6.75, -1.78, 0.28, 0.62, 'button',        0.02,  0.00,  0.00],
  [ 0.00,  1.78, 1.42, 2.93, 'mature',        0.12,  0.03, -0.02],
  [-3.50,  1.78, 1.18, 2.70, 'convex',       -0.10, -0.04,  0.03],
  [ 3.40,  1.78, 0.76, 2.36, 'hemispherical', 0.07,  0.05,  0.00],
  [ 6.35,  1.78, 0.30, 0.60, 'button',       -0.02,  0.00,  0.00]
];

const stemColliders = [];
const domes = [];
PLAN.forEach(([x, z, capR, stemH, stage, bend, tiltX, tiltZ]) => {
  const st = S[stage];
  const m = makeMushroom({
    x, z, capR, stemH, stemR: capR * st.r,
    capH: capR * st.h * rand(0.94, 1.06),
    gillRise: st.gr * rand(0.92, 1.08),
    crimson: st.crimson,
    crustStage: st.crust,
    bend, tiltX, tiltZ
  });
  scene.add(m.group);
  if (m.stemCollider) stemColliders.push(m.stemCollider);
  domes.push(m.dome);
});

/* --- two dark figures, ~1.72 m, standing under the caps --- */
function makeFigure(h, x, z, ry){
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = ry;
  const k = h / 1.62;
  const pts = [[0.20,0],[0.21,0.30],[0.20,0.62],[0.19,0.86],[0.22,0.98],
               [0.20,1.12],[0.15,1.24],[0.11,1.32],[0.10,1.40],[0.085,1.46],
               [0.075,1.52],[0.03,1.56]];
  const body = new THREE.Mesh(revolve(pts.map(([r,y]) => new THREE.Vector2(r*k, y*k)), 22), MAT.body);
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  scene.add(g);
}
makeFigure(1.72, -4.4, -0.55, 0.42);
makeFigure(1.78,  2.1,  0.62, -2.5);

/* ============================================================
   9.  LIGHTING  —  keyed from the floor
       Cool-neutral white (≈4800 K) rises from the slits; the ceilings
       catch only soft bounce, so the tops of the caps sit in shadow.
   ============================================================ */
const hemi = new THREE.HemisphereLight(0x7f8b95, 0xfff3e2, 0.50);   // dark cool above, warm bounce below
scene.add(hemi);

SLITS_X.forEach((x, i) => {
  if (i % 2) return;                                  // one light per pair of slits
  const l = new THREE.PointLight(0xfff6ec, 10, 9.5, 2);
  l.position.set(x, 0.28, 0);
  scene.add(l);
});
// two soft wide fills so distant caps are not pitch black
const f1 = new THREE.PointLight(0xfff2e2, 6, 13, 2); f1.position.set(-1.6, 1.1, 0); scene.add(f1);
const f2 = new THREE.PointLight(0xfff2e2, 6, 13, 2); f2.position.set( 3.4, 1.1, 0); scene.add(f2);

/* Shadow key.  Point-light shadows cost six faces each, so the casting is
   carried by two wide, heavily-penumbra'd spots aimed straight UP out of the
   floor — the cheapest way to get the installation's inverted shadows onto
   the ceiling.  The point lights above stay shadowless and do the shaping. */
if (!IS_TOUCH){
  [-5.0, 0.0, 5.0].forEach(sx => {
    const sp = new THREE.SpotLight(0xfff6ec, 8, 11, 0.85, 0.6, 2);
    sp.position.set(sx, 0.06, 0);
    sp.target.position.set(sx, ROOM.h, 0);
    sp.castShadow = true;
    sp.shadow.mapSize.set(2048, 2048);
    sp.shadow.camera.near = 0.5;
    sp.shadow.camera.far  = ROOM.h + 1;
    sp.shadow.bias = -0.0012;
    sp.shadow.normalBias = 0.012;   // was 2 cm — the size of the wart relief itself
    sp.shadow.radius = 8;           // VSM blur: this is what makes the edges soft
    sp.shadow.blurSamples = 16;
    scene.add(sp, sp.target);
  });
}

/* ============================================================
   10.  POST
   ============================================================ */
let composer = null, bloomPass = null, aoPass = null;
if (USE_BLOOM){
  try {
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    /* AO does more for the gills and the wart bases than any amount of extra
       geometry — the pleat valleys have almost no other occlusion cue. */
    try {
      const gtao = new GTAOPass(scene, camera, window.innerWidth, window.innerHeight);
      gtao.output = GTAOPass.OUTPUT.Default;
      gtao.updateGtaoMaterial({ radius: 0.11, distanceExponent: 1.7, thickness: 0.35,
                                scale: 1.0, samples: 16, screenSpaceRadius: false });
      composer.addPass(gtao);
      aoPass = gtao;
    } catch(e){ /* addon shape varies by build; AO is optional */ }
    bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.38, 0.70, 0.86);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());
  } catch(e){ composer = null; }
}

/* ============================================================
   11.  PLAYER  —  eye 1.62 m standing, 0.92 m crouched
   ============================================================ */
const player = {
  pos: new THREE.Vector3(-6.0, 0, 0),
  vel: new THREE.Vector3(),
  yaw: -Math.PI / 2,          // looking down +X, down the aisle
  pitch: 0.13,
  bob: 0,
  eye: 1.62,
  crouch: false
};
const EYE_STAND = 1.62, EYE_DUCK = 0.92, BODY_R = 0.30;
const BOUNDS = { x: ROOM.w / 2 - 0.45, z: ROOM.d / 2 - 0.45 };
const keys = Object.create(null);

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR'){
    player.pos.set(-6.0, 0, 0); player.yaw = -Math.PI / 2; player.pitch = 0.13;
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const panel = document.getElementById('panel');
let state = 'ready';

function start(){
  if (state === 'playing') return;
  if (!IS_TOUCH) canvas.requestPointerLock();
  else setPlaying();
}
function setPlaying(){
  state = 'playing';
  panel.classList.add('gone');
  document.body.classList.add('playing');
}
function pause(){
  state = 'paused';
  panel.classList.remove('gone');
  document.body.classList.remove('playing');
  panel.querySelector('h1').innerHTML = 'Paused';
  panel.querySelector('.sub').textContent = 'Click to keep exploring';
  document.getElementById('enter').textContent = 'Resume';
}
document.getElementById('enter').addEventListener('click', start);
canvas.addEventListener('click', () => { if (state === 'paused' || state === 'ready') start(); });

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === canvas) setPlaying();
  else if (!IS_TOUCH && state === 'playing') pause();
});
document.addEventListener('mousemove', e => {
  if (state !== 'playing' || IS_TOUCH) return;
  player.yaw   -= e.movementX * 0.0020;
  player.pitch -= e.movementY * 0.0020;
  player.pitch = clamp(player.pitch, -1.35, 1.35);
});

/* ----- touch ----- */
const stickEl = document.getElementById('stick');
const knobEl  = document.getElementById('knob');
const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
const look  = { active: false, id: null, x: 0, y: 0 };

canvas.addEventListener('touchstart', e => {
  if (state !== 'playing') return;
  for (const t of e.changedTouches){
    if (!stick.active && t.clientX < innerWidth * 0.44){
      stick.active = true; stick.id = t.identifier;
      stick.ox = t.clientX; stick.oy = t.clientY; stick.x = stick.y = 0;
      stickEl.style.left = t.clientX + 'px';
      stickEl.style.top  = t.clientY + 'px';
      stickEl.style.opacity = '1';
    } else if (!look.active){
      look.active = true; look.id = t.identifier;
      look.x = t.clientX; look.y = t.clientY;
    }
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  for (const t of e.changedTouches){
    if (stick.active && t.identifier === stick.id){
      const dx = t.clientX - stick.ox, dy = t.clientY - stick.oy;
      const R = 52, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / R);
      stick.x = dx / d * k; stick.y = dy / d * k;
      knobEl.style.transform = `translate(${stick.x * 34}px, ${stick.y * 34}px)`;
    } else if (look.active && t.identifier === look.id){
      const dx = t.clientX - look.x, dy = t.clientY - look.y;
      look.x = t.clientX; look.y = t.clientY;
      player.yaw   -= dx * 0.0040;
      player.pitch = clamp(player.pitch - dy * 0.0040, -1.35, 1.35);
    }
  }
  e.preventDefault();
}, { passive: false });

function endTouch(e){
  for (const t of e.changedTouches){
    if (stick.active && t.identifier === stick.id){
      stick.active = false; stick.x = stick.y = 0;
      stickEl.style.opacity = '0';
      knobEl.style.transform = 'translate(0,0)';
    }
    if (look.active && t.identifier === look.id) look.active = false;
  }
}
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);
// touch crouch
let duckTouch = false;
canvas.addEventListener('touchstart', e => { if (state === 'playing' && e.touches.length > 2) duckTouch = true; });
canvas.addEventListener('touchend', () => { duckTouch = false; });

/* ============================================================
   12.  WALK · COLLIDE · DUCK
   ============================================================ */
/* Vertical clearance under the hanging bowls at a world (x, z).
   Returns the y of the cap's underside, or Infinity if clear of it. */
function clearanceUnder(dome, px, pz){
  const dx = px - dome.x, dz = pz - dome.z;
  const d = Math.hypot(dx, dz);
  if (d >= dome.capR) return Infinity;
  const t = d / dome.capR;
  const phi = dome.phiMax * t;
  return dome.rimY + (dome.y0 - dome.Rs * Math.cos(phi));   // ∈ [rimY-capH, rimY]
}

const duckEl = document.getElementById('duck');
const tmpHead = new THREE.Vector3();

function updatePlayer(dt){
  let fwd = 0, str = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    fwd += 1;
  if (keys['KeyS'] || keys['ArrowDown'])  fwd -= 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  str -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) str += 1;
  if (stick.active){ fwd -= stick.y; str += stick.x; }
  const mag = Math.hypot(fwd, str);
  if (mag > 1){ fwd /= mag; str /= mag; }

  // ---- the ceiling of the exhibit decides how tall you may stand ----
  let maxHead = Infinity;
  for (const dm of domes) maxHead = Math.min(maxHead, clearanceUnder(dm, player.pos.x, player.pos.z));

  const wantDuck = keys['KeyC'] || keys['ControlLeft'] || keys['ControlRight'] ||
                   keys['KeyX'] || duckTouch;
  const target = Math.min(wantDuck ? EYE_DUCK : EYE_STAND, maxHead - 0.07);
  player.eye += (clamp(target, 0.55, EYE_STAND) - player.eye) * Math.min(1, 8 * dt);
  const ducking = player.eye < EYE_STAND - 0.06;
  player.crouch = ducking;
  duckEl.classList.toggle('on', ducking && state === 'playing');

  const run = (keys['ShiftLeft'] || keys['ShiftRight']) ? 1.65 : 1.0;
  const speed = (ducking ? 1.7 : 3.0) * run;

  const sinY = Math.sin(player.yaw), cosY = Math.cos(player.yaw);
  const wishX = -sinY * fwd + cosY * str;
  const wishZ = -cosY * fwd - sinY * str;

  const accel = 15;
  player.vel.x += (wishX * speed - player.vel.x) * Math.min(1, accel * dt);
  player.vel.z += (wishZ * speed - player.vel.z) * Math.min(1, accel * dt);

  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;

  // room bounds
  player.pos.x = clamp(player.pos.x, -BOUNDS.x, BOUNDS.x);
  player.pos.z = clamp(player.pos.z, -BOUNDS.z, BOUNDS.z);

  // solid stipes — squeeze between them
  for (const c of stemColliders){
    const dx = player.pos.x - c.x, dz = player.pos.z - c.z;
    const d = Math.hypot(dx, dz), min = c.r + BODY_R;
    if (d < min && d > 1e-4){
      const k = (min - d) / d;
      player.pos.x += dx * k;
      player.pos.z += dz * k;
    }
  }

  // head bob
  const moving = Math.hypot(player.vel.x, player.vel.z);
  player.bob += dt * moving * (run > 1 ? 2.2 : 1.8);
  const bobY = Math.sin(player.bob * 3.3) * 0.024 * Math.min(1, moving / 3);
  const bobX = Math.cos(player.bob * 1.7) * 0.018 * Math.min(1, moving / 3);

  camera.position.set(player.pos.x + bobX * cosY, player.eye + bobY, player.pos.z - bobX * sinY);
  camera.rotation.set(player.pitch, player.yaw + bobX * 0.02, Math.sin(player.bob * 1.7) * 0.004);
}

/* ============================================================
   13.  LOOP
   ============================================================ */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === 'playing') updatePlayer(dt);
  else if (state !== 'free'){
    player.pos.set(-6.0, 0, 0);
    camera.position.set(player.pos.x, EYE_STAND, player.pos.z);
    camera.rotation.set(player.pitch, player.yaw, 0);
  }
  if (composer) composer.render();
  else renderer.render(scene, camera);
}

addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  applyFov();
  renderer.setSize(w, h);
  if (composer) composer.setSize(w, h);
  if (aoPass && aoPass.setSize) aoPass.setSize(w, h);
  if (bloomPass) bloomPass.resolution.set(w, h);
});

/* ============================================================
   14.  HUD
   ============================================================ */
const rows = IS_TOUCH
  ? [['drag','look up into the gills'], ['stick','walk the aisle'],
     ['3 fingers','duck'], ['','the mature caps clear only 1.6 m']]
  : [['WASD','walk'], ['mouse','look'], ['C / CTRL','duck'], ['shift','run'],
     ['R','back to the threshold'], ['esc','release cursor']];
document.getElementById('keys').innerHTML = rows.map(([k, v]) =>
  `<div class="k">${k ? `<b>${k}</b>` : '<b>·</b>'}<span>${v}</span></div>`).join('');
if (IS_TOUCH){
  document.getElementById('tiny').textContent = 'Left thumb walks, right thumb looks, three fingers duck.';
  document.getElementById('hint').textContent = 'duck under the big caps · look up at the gills';
}

/* ?debug exposes a free camera so the scene can be inspected without pointer
   lock — there is no other way to verify geometry from a headless browser. */
if (location.search.includes('debug')){
  window.__room = { THREE, scene, camera, renderer, player, MAT,
    look(px, py, pz, yaw, pitch = 0){
      state = 'free';
      camera.position.set(px, py, pz);
      camera.rotation.set(pitch, yaw, 0);
      panel.classList.add('gone');
    }
  };
}

requestAnimationFrame(() => {
  renderer.compile(scene, camera);
  setTimeout(() => document.getElementById('load').classList.add('gone'), 280);
});
requestAnimationFrame(frame);
</script>
</body>
</html>
