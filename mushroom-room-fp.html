<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Upside-Down Mushroom Room — First-Person Walkthrough</title>
<style>
  :root{
    --ink:#141414;
    --red:#d94f2e;
    --paper:#f6f4f1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#eceae6;
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink)}
  canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}

  /* ---------- crosshair ---------- */
  #cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
    background:rgba(20,20,20,.42);box-shadow:0 0 0 1.5px rgba(255,255,255,.55);opacity:0;transition:opacity .4s;pointer-events:none;z-index:5}
  body.playing #cross{opacity:1}

  /* ---------- hint bar ---------- */
  #hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#2b2b2b;
    background:rgba(255,255,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(0,0,0,.07);border-radius:100px;padding:9px 18px;white-space:nowrap;
    opacity:0;transition:opacity .5s;pointer-events:none}
  body.playing #hint{opacity:1}

  /* ---------- title / start panel ---------- */
  #panel{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 40%,#ffffff 0%,#f2efeb 55%,#e6e1db 100%);
    transition:opacity .55s ease, visibility .55s}
  #panel.gone{opacity:0;visibility:hidden}
  #panel .wrap{width:min(680px,88vw);text-align:center}
  #panel h1{margin:0 0 14px;font-size:clamp(30px,6.4vw,58px);line-height:.98;font-weight:800;letter-spacing:-.02em}
  #panel h1 em{font-style:normal;color:var(--red)}
  #panel .sub{margin:0 0 30px;font-size:13.5px;letter-spacing:.16em;text-transform:uppercase;color:#8a8580}
  #panel .rule{width:54px;height:3px;background:var(--red);margin:0 auto 30px;border-radius:2px}
  .keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 26px;margin:0 auto 34px;max-width:460px;text-align:left}
  .k{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#4a4644}
  .k b{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 7px;
    border:1px solid rgba(0,0,0,.16);border-radius:6px;background:#fff;font-weight:600;font-size:11px;
    box-shadow:0 1px 0 rgba(0,0,0,.06)}
  #enter{appearance:none;border:0;cursor:pointer;background:var(--ink);color:#fff;font:inherit;font-size:12.5px;
    letter-spacing:.14em;text-transform:uppercase;padding:16px 40px;border-radius:100px;transition:transform .18s, background .18s}
  #enter:hover{background:var(--red);transform:translateY(-1px)}
  #enter:active{transform:translateY(0)}
  #panel .tiny{margin:18px 0 0;font-size:11px;color:#9d9893;letter-spacing:.03em}
  .cred{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:10.5px;letter-spacing:.18em;
    text-transform:uppercase;color:#b3ada6;z-index:21}
  #panel.gone + .cred{opacity:0;transition:opacity .4s}

  /* ---------- loading ---------- */
  #load{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#f4f1ee;
    font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:#8d8882;transition:opacity .5s}
  #load.gone{opacity:0;pointer-events:none}
  #load span{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* ---------- touch sticks ---------- */
  #stick{position:fixed;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;
    border:1.5px solid rgba(0,0,0,.16);background:rgba(255,255,255,.22);pointer-events:none;opacity:0;z-index:7;
    transition:opacity .2s}
  #knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
    background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.12);box-shadow:0 2px 10px rgba(0,0,0,.12)}
  #tlook{position:fixed;inset:0;z-index:4;display:none}
  body.touch #tlook{display:block}
  body.touch #hint{font-size:10px;padding:8px 14px}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="tlook"></div>
<div id="cross"></div>
<div id="stick"><div id="knob"></div></div>
<div id="hint">W A S D walk &nbsp;·&nbsp; mouse look &nbsp;·&nbsp; shift run &nbsp;·&nbsp; esc release</div>

<div id="panel">
  <div class="wrap">
    <h1>The Upside&ndash;Down<br><em>Mushroom</em> Room</h1>
    <p class="sub">A first-person walkthrough</p>
    <div class="rule"></div>
    <div class="keys" id="keys"></div>
    <button id="enter">Enter the room</button>
    <p class="tiny" id="tiny">Best with a mouse. Headphones optional — it's quiet in here.</p>
  </div>
</div>
<div class="cred">procedural reconstruction &nbsp;·&nbsp; three.js</div>

<div id="load"><span>building the room…</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   0.  DEVICE / QUALITY
   ============================================================ */
const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
const Q = IS_TOUCH ? 0.5 : 1;                 // geometry density multiplier
const USE_BLOOM = !IS_TOUCH;
document.body.classList.toggle('touch', IS_TOUCH);

/* ============================================================
   1.  SMALL UTILITIES
   ============================================================ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(1301);
const rand = (a, b) => a + rng() * (b - a);

// cheap smooth pseudo-noise (sum of sines)
function noise2(x, y, s){
  return 0.55 * Math.sin(x * 1.7 + y * 0.8 + s)
       + 0.30 * Math.sin(x * 3.3 - y * 2.1 + s * 1.7)
       + 0.15 * Math.sin(x * 6.1 + y * 4.7 + s * 2.9);
}

/* Revolve a 2-D profile (x = radius, y = height) around the Y axis.
   Vertex winding is set so that normals point outward for a profile
   whose height increases with index.  UV: u = around, v = arc length. */
function revolve(profile, segs){
  const n = profile.length;
  const verts = [], uvs = [], idx = [];
  const arc = [0];
  for (let j = 1; j < n; j++){
    arc[j] = arc[j-1] + Math.hypot(profile[j].x - profile[j-1].x, profile[j].y - profile[j-1].y);
  }
  const total = arc[n-1] || 1;
  for (let j = 0; j < n; j++){
    const p = profile[j];
    for (let i = 0; i <= segs; i++){
      const th = i / segs * Math.PI * 2;
      verts.push(p.x * Math.sin(th), p.y, p.x * Math.cos(th));
      uvs.push(i / segs, arc[j] / total);
    }
  }
  for (let j = 0; j < n - 1; j++){
    for (let i = 0; i < segs; i++){
      const a = j * (segs + 1) + i, b = a + 1, c = a + segs + 1, d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* A hanging mushroom cap is a spherical bowl: rim at y = 0, lowest
   point (apex) at y = -H, widest radius R at the rim. */
function capSpherical(R, H){
  const y0 = (R * R - H * H) / (2 * H);       // sphere centre height above rim
  const Rs = y0 + H;                          // sphere radius
  const phiMax = Math.atan2(R, y0);
  return { y0, Rs, phiMax,
    at(t){ const phi = phiMax * t;
      return { phi, r: Rs * Math.sin(phi), y: y0 - Rs * Math.cos(phi),
        n: new THREE.Vector3(Math.sin(phi) * Math.sin(0), -Math.cos(phi), Math.sin(phi) * Math.cos(0)) };
    }
  };
}

/* ============================================================
   2.  RENDERER / SCENE / CAMERA
   ============================================================ */
const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: !IS_TOUCH, powerPreference: 'high-performance' });
} catch(e){
  document.getElementById('load').innerHTML = '<span>WebGL is unavailable in this browser</span>';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.6 : 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3f1ee);
scene.fog = new THREE.FogExp2(0xf4f2ef, 0.0055);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 200);
camera.rotation.order = 'YXZ';

// soft neutral studio image-based lighting
try {
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.035).texture;
  pmrem.dispose();
  if ('environmentIntensity' in scene) scene.environmentIntensity = 1.0;
} catch(e){ /* non fatal */ }

/* ============================================================
   3.  THE ROOM
   ============================================================ */
const ROOM = { w: 26, d: 18, h: 10 };   // x: -13..13, z: -9..9, y: 0..10

const wallMat  = new THREE.MeshStandardMaterial({ color: 0xfbfaf8, roughness: 0.96, metalness: 0 });
const floorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.34, metalness: 0 });
const ceilMat  = new THREE.MeshStandardMaterial({ color: 0xf5f3f0, roughness: 0.98, metalness: 0 });

const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), ceilMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = ROOM.h;
scene.add(ceiling);

function wall(x, z, ry){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.h), wallMat);
  m.position.set(x, ROOM.h / 2, z);
  m.rotation.y = ry;
  if (Math.abs(ry) > 3) m.geometry = new THREE.PlaneGeometry(ROOM.d, ROOM.h);
  scene.add(m);
}
wall(0, -ROOM.d / 2, 0);
wall(0,  ROOM.d / 2, Math.PI);
wall(-ROOM.w / 2, 0,  Math.PI / 2);
wall( ROOM.w / 2, 0, -Math.PI / 2);

// faint cove line where wall meets ceiling (sells the gallery look)
const coveMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
[[0, -ROOM.d/2 + 0.02, ROOM.w, 0], [0, ROOM.d/2 - 0.02, ROOM.w, 0],
 [-ROOM.w/2 + 0.02, 0, ROOM.d, 1], [ROOM.w/2 - 0.02, 0, ROOM.d, 1]].forEach(([x, z, len, rot]) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len, 0.5), coveMat);
  m.position.set(x, ROOM.h - 0.28, z);
  m.rotation.x = Math.PI / 2;
  m.rotation.z = rot ? Math.PI / 2 : 0;
  scene.add(m);
});

/* ---------- glowing strips inset in the floor ---------- */
const stripMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2.6, roughness: 1, metalness: 0
});
const stripGeo = new THREE.PlaneGeometry(1.95, 0.42);
[[-4.8], [1.6]].forEach(([cx]) => {
  for (let i = 0; i < 7; i++){
    const z = -6.3 + i * 2.1;
    const s = new THREE.Mesh(stripGeo, stripMat);
    s.rotation.x = -Math.PI / 2;
    s.position.set(cx, 0.012, z);
    scene.add(s);
  }
});

/* ============================================================
   4.  MUSHROOM MATERIALS + TEXTURES
   ============================================================ */
function makeGillTexture(){
  const w = 2048, h = 256;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#f8f3eb'; g.fillRect(0, 0, w, h);
  const lines = 300;
  for (let i = 0; i < lines; i++){
    const x = (i + 0.5) / lines * w;
    g.strokeStyle = (i % 2) ? 'rgba(188,174,158,0.60)' : 'rgba(210,197,182,0.42)';
    g.lineWidth = 1.7;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke();
  }
  // uv.y = 1 sits at the rim (top of canvas) — gills darken toward the stem
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, 'rgba(255,255,255,0)');
  grd.addColorStop(1, 'rgba(122,106,92,0.34)');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
function makeCapTexture(){
  const s = 512;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#d94f2e'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 140; i++){
    const x = rng() * s, y = rng() * s, r = rand(16, 90);
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    const warm = rng() > 0.5;
    grad.addColorStop(0, warm ? 'rgba(233,104,66,0.42)' : 'rgba(178,58,32,0.30)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 2);
  return t;
}

const gillTex = makeGillTexture();
const capTex  = makeCapTexture();

const MAT = {
  cap   : new THREE.MeshStandardMaterial({ map: capTex, color: 0xffffff, roughness: 0.60, metalness: 0,
                                           side: THREE.DoubleSide }),
  gill  : new THREE.MeshStandardMaterial({ map: gillTex, color: 0xffffff, roughness: 0.78, metalness: 0,
                                           side: THREE.DoubleSide }),
  stem  : new THREE.MeshStandardMaterial({ color: 0xeee7dc, roughness: 0.92, metalness: 0, side: THREE.DoubleSide }),
  spot  : new THREE.MeshStandardMaterial({ color: 0xfbf6ee, roughness: 0.86, metalness: 0 }),
  body  : new THREE.MeshStandardMaterial({ color: 0x24242a, roughness: 0.55, metalness: 0.05 }),
  ceilAnchor : new THREE.MeshStandardMaterial({ color: 0xefeadf, roughness: 0.95 })
};

/* ============================================================
   5.  BUILD ONE MUSHROOM
   ============================================================ */
const spotGeo = new THREE.SphereGeometry(1, 14, 10);

function makeMushroom(cfg){
  const { x, z, capR, capH, stemH, stemR, tiltX = 0, tiltZ = 0, density = 1 } = cfg;
  const grp = new THREE.Group();
  grp.position.set(x, ROOM.h, z);
  grp.rotation.set(tiltX, rand(0, Math.PI * 2), tiltZ);

  const phase = rand(0, 20);
  const rimY = -stemH;                       // local y of the cap rim

  /* ---- stem (rough tapered column, bulging where it meets the ceiling) ---- */
  const NS = Math.max(14, Math.round(26 * Q));
  const stemProfile = [];
  for (let j = 0; j <= NS; j++){
    const u = 1 - j / NS;                    // 1 = cap end, 0 = ceiling
    const y = -stemH * u;
    let r = stemR * (0.80 + 1.05 * Math.exp(-u * 5.0) + 0.10 * Math.sin(u * 7.0));
    r *= 1 + 0.34 * Math.exp(-Math.pow((u - 1) / 0.085, 2));   // flare into the gills
    stemProfile.push(new THREE.Vector2(r, y));
  }
  const stemGeo = revolve(stemProfile, Math.max(14, Math.round(56 * Q)));
  {
    const p = stemGeo.attributes.position;
    for (let i = 0; i < p.count; i++){
      const px = p.getX(i), py = p.getY(i), pz = p.getZ(i);
      const rr = Math.hypot(px, pz);
      if (rr < 1e-5) continue;
      const th = Math.atan2(px, pz);
      const n = noise2(th * 2.3, py * 1.5, phase);
      const sc = 1 + 0.085 * n;
      p.setX(i, px * sc); p.setZ(i, pz * sc);
      p.setY(i, py + 0.035 * n);
    }
    stemGeo.computeVertexNormals();
  }

  /* ---- cap: spherical bowl, rim at y = 0, apex at y = -capH ---- */
  const capSegs = Math.max(72, Math.min(768, Math.round(capR * 132 * Q) * density));
  const y0 = (capR * capR - capH * capH) / (2 * capH);
  const Rs = y0 + capH;
  const phiMax = Math.atan2(capR, y0);
  const NR = 24;
  const capProfile = [];
  for (let j = 0; j <= NR; j++){
    const phi = phiMax * (j / NR);
    capProfile.push(new THREE.Vector2(Rs * Math.sin(phi), y0 - Rs * Math.cos(phi)));
  }
  // rolled rim so the edge reads with a little thickness
  const rimT = Math.max(0.05, capR * 0.016);
  capProfile.push(new THREE.Vector2(capR * 0.985, rimT * 0.55));
  capProfile.push(new THREE.Vector2(capR * 0.905, rimT * 1.15));
  const capGeo = revolve(capProfile, capSegs);

  /* ---- gills: same bowl, offset inward, corrugated ---- */
  const gOff = 0.035 + capR * 0.006;
  const rIn = Math.max(0.05, stemR * 1.02);
  const phiIn = Math.asin(Math.min(0.999, rIn / Rs));
  const NG = 18;
  const gillProfile = [];
  for (let j = 0; j <= NG; j++){
    const phi = phiIn + (phiMax - phiIn) * (j / NG);
    const r = Rs * Math.sin(phi), y = y0 - Rs * Math.cos(phi);
    const nx = Math.sin(phi), ny = -Math.cos(phi);
    gillProfile.push(new THREE.Vector2(r - nx * gOff, y - ny * gOff));
  }
  const gillGeo = revolve(gillProfile, capSegs);
  {
    const fins = Math.max(48, Math.round(capSegs / 3));
    const amp = Math.min(0.035, 0.006 + capR * 0.005);
    const p = gillGeo.attributes.position;
    for (let i = 0; i < p.count; i++){
      const px = p.getX(i), py = p.getY(i), pz = p.getZ(i);
      const rr = Math.hypot(px, pz);
      if (rr < 1e-4) continue;
      const th = Math.atan2(px, pz);
      const a = amp * Math.sin(th * fins);
      p.setX(i, px + a * px / rr);
      p.setZ(i, pz + a * pz / rr);
      p.setY(i, py + a * 0.35);
    }
    gillGeo.computeVertexNormals();
  }

  /* ---- white patches on the outer (downward-facing) surface ---- */
  const nSpots = Math.round(rand(16, 30) * Math.min(1.6, capR / 2.2));
  const spots = new THREE.InstancedMesh(spotGeo, MAT.spot, nSpots);
  const mtx = new THREE.Matrix4(), q = new THREE.Quaternion();
  const up = new THREE.Vector3(0, 1, 0), sc = new THREE.Vector3(), pos = new THREE.Vector3();
  for (let i = 0; i < nSpots; i++){
    const t = Math.sqrt(rng());                       // uniform over area
    const th = rng() * Math.PI * 2;
    const phi = phiMax * t;
    const r = Rs * Math.sin(phi), yy = y0 - Rs * Math.cos(phi);
    const n = new THREE.Vector3(Math.sin(phi) * Math.sin(th), -Math.cos(phi), Math.sin(phi) * Math.cos(th)).normalize();
    pos.set(r * Math.sin(th), yy, r * Math.cos(th)).addScaledVector(n, 0.012);
    q.setFromUnitVectors(up, n);
    const s = capR * rand(0.028, 0.055) * (1 + 0.5 * (1 - t));
    sc.set(s * rand(0.85, 1.25), s * 0.34, s * rand(0.85, 1.25));
    mtx.compose(pos, q, sc);
    spots.setMatrixAt(i, mtx);
  }
  spots.instanceMatrix.needsUpdate = true;

  // assemble
  const stemMesh = new THREE.Mesh(stemGeo, MAT.stem);
  const capMesh  = new THREE.Mesh(capGeo, MAT.cap);
  const gillMesh = new THREE.Mesh(gillGeo, MAT.gill);
  capMesh.position.y  = rimY;
  gillMesh.position.y = rimY;

  // ceiling anchor blob (rough collar where the stem meets the ceiling)
  const anchorProfile = [];
  for (let j = 0; j <= 10; j++){
    const u = j / 10;
    anchorProfile.push(new THREE.Vector2(stemR * (1.85 - 0.75 * u) * (1 + 0.06 * Math.sin(u * 22 + phase)), -u * 0.55));
  }
  const anchor = new THREE.Mesh(revolve(anchorProfile, 40), MAT.ceilAnchor);

  grp.add(stemMesh, capMesh, gillMesh, spots, anchor);

  return {
    group: grp,
    // world-space collider for caps that hang low enough to bump into
    collider: (ROOM.h - stemH - capH) < 2.5
      ? { x, z, r: capR * 0.93 }
      : null
  };
}

/* ============================================================
   6.  LAY OUT THE EXHIBIT
   ============================================================ */
const MUSHROOMS = [
  { x: -6.4, z: -4.6, capR: 5.3, capH: 0.78, stemH: 7.55, stemR: 0.62, tiltX: -0.14 },
  { x:  0.4, z: -6.6, capR: 2.3, capH: 0.95, stemH: 5.60, stemR: 0.40, tiltX:  0.20 },
  { x:  5.6, z: -4.2, capR: 3.1, capH: 1.05, stemH: 6.55, stemR: 0.46, tiltX: -0.08, tiltZ: 0.10 },
  { x: -2.4, z: -1.2, capR: 0.95, capH: 0.85, stemH: 3.15, stemR: 0.22 },
  { x:  2.3, z: -2.1, capR: 1.5,  capH: 0.72, stemH: 4.35, stemR: 0.26, tiltX: 0.16 },
  { x:  8.4, z: -7.0, capR: 2.1,  capH: 0.88, stemH: 5.85, stemR: 0.34 },
  { x: -9.6, z:  2.0, capR: 2.7,  capH: 0.92, stemH: 6.20, stemR: 0.42, tiltX: -0.22 },
  { x: -3.1, z:  3.6, capR: 1.9,  capH: 0.82, stemH: 5.00, stemR: 0.30 },
  { x:  3.6, z:  4.1, capR: 3.5,  capH: 1.02, stemH: 6.85, stemR: 0.50, tiltX: 0.07 },
  { x:  9.2, z:  3.2, capR: 1.65, capH: 0.76, stemH: 4.60, stemR: 0.28 },
  { x: -7.4, z:  8.0, capR: 2.45, capH: 0.86, stemH: 6.00, stemR: 0.38, tiltZ: 0.13 },
  { x:  6.7, z:  8.3, capR: 1.35, capH: 0.70, stemH: 4.10, stemR: 0.24 }
];

const colliders = [];
MUSHROOMS.forEach(cfg => {
  const m = makeMushroom(cfg);
  scene.add(m.group);
  if (m.collider) colliders.push(m.collider);
});

/* ---------- two dark figures, as in the room ---------- */
function makePerson(h, x, z, ry){
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = ry;

  const prof = [];
  const pts = [
    [0.20, 0.00], [0.21, 0.30], [0.20, 0.62], [0.19, 0.86],
    [0.22, 0.98], [0.20, 1.12], [0.15, 1.24], [0.11, 1.32],
    [0.10, 1.40], [0.085, 1.46], [0.075, 1.52], [0.03, 1.56]
  ];
  const k = h / 1.62;
  pts.forEach(([r, y]) => prof.push(new THREE.Vector2(r * k, y * k)));
  const body = new THREE.Mesh(revolve(prof, 20), MAT.body);
  g.add(body);
  scene.add(g);
  return { x, z, r: 0.34 };
}
colliders.push(makePerson(1.72, -5.9, -2.5, 0.35));
colliders.push(makePerson(1.78,  1.1, -1.9, -2.6));

/* ============================================================
   7.  LIGHTS
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xffffff, 0xded8d0, 0.45);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff7ef, 1.15);
key.position.set(6, 17, 7);
scene.add(key);

const fill = new THREE.DirectionalLight(0xffffff, 0.45);
fill.position.set(-9, 11, -8);
scene.add(fill);

// gentle pools of light above the floor strips
[[-4.8], [1.6]].forEach(([cx]) => {
  for (let i = 0; i < 3; i++){
    const l = new THREE.PointLight(0xfff3e4, 6, 9, 2);
    l.position.set(cx, 0.55, -4.4 + i * 4.4);
    scene.add(l);
  }
});
// two soft ceiling fills so the caps catch light from above
const c1 = new THREE.PointLight(0xffffff, 90, 34, 2); c1.position.set(0, ROOM.h - 0.7, -2); scene.add(c1);
const c2 = new THREE.PointLight(0xffffff, 70, 34, 2); c2.position.set(4, ROOM.h - 0.7,  5); scene.add(c2);

/* ============================================================
   8.  POST
   ============================================================ */
let composer = null, bloomPass = null;
if (USE_BLOOM){
  try {
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.30, 0.62, 0.94);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());
  } catch(e){ composer = null; }
}

/* ============================================================
   9.  PLAYER
   ============================================================ */
const player = {
  pos: new THREE.Vector3(0.4, 1.62, 7.6),
  vel: new THREE.Vector3(),
  yaw: Math.PI,                 // face -Z (into the room)
  pitch: 0.10,
  bob: 0,
  eye: 1.62
};
const BOUNDS = { x: ROOM.w / 2 - 0.6, z: ROOM.d / 2 - 0.6 };
const keys = Object.create(null);

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR'){ player.pos.set(0.4, player.eye, 7.6); player.yaw = Math.PI; player.pitch = 0.10; }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ----- pointer lock (desktop) ----- */
const panel = document.getElementById('panel');
let state = 'ready';                       // ready | playing | paused

function start(){
  if (state === 'playing') return;
  if (!IS_TOUCH){
    canvas.requestPointerLock();
  } else {
    setPlaying();
  }
}
function setPlaying(){
  state = 'playing';
  panel.classList.add('gone');
  document.body.classList.add('playing');
}
function pause(){
  state = 'paused';
  panel.classList.remove('gone');
  document.body.classList.remove('playing');
  panel.querySelector('h1').innerHTML = 'Paused';
  panel.querySelector('.sub').textContent = 'Click to keep exploring';
  document.getElementById('enter').textContent = 'Resume';
}
document.getElementById('enter').addEventListener('click', start);
canvas.addEventListener('click', () => { if (state === 'paused' || state === 'ready') start(); });

document.addEventListener('pointerlockchange', () => {
  if (document.pointerLockElement === canvas) setPlaying();
  else if (!IS_TOUCH && state === 'playing') pause();
});
document.addEventListener('mousemove', e => {
  if (state !== 'playing' || IS_TOUCH) return;
  player.yaw   -= e.movementX * 0.0021;
  player.pitch -= e.movementY * 0.0021;
  player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch));
});

/* ----- touch controls ----- */
const stickEl = document.getElementById('stick');
const knobEl = document.getElementById('knob');
const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
const look = { active: false, id: null, x: 0, y: 0 };

canvas.addEventListener('touchstart', e => {
  if (state !== 'playing') return;
  for (const t of e.changedTouches){
    if (!stick.active && t.clientX < innerWidth * 0.44){
      stick.active = true; stick.id = t.identifier;
      stick.ox = t.clientX; stick.oy = t.clientY; stick.x = stick.y = 0;
      stickEl.style.left = t.clientX + 'px';
      stickEl.style.top  = t.clientY + 'px';
      stickEl.style.opacity = '1';
    } else if (!look.active){
      look.active = true; look.id = t.identifier;
      look.x = t.clientX; look.y = t.clientY;
    }
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  for (const t of e.changedTouches){
    if (stick.active && t.identifier === stick.id){
      const dx = t.clientX - stick.ox, dy = t.clientY - stick.oy;
      const R = 52, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / R);
      stick.x = dx / d * k; stick.y = dy / d * k;
      knobEl.style.transform = `translate(${stick.x * 34}px, ${stick.y * 34}px)`;
    } else if (look.active && t.identifier === look.id){
      const dx = t.clientX - look.x, dy = t.clientY - look.y;
      look.x = t.clientX; look.y = t.clientY;
      player.yaw   -= dx * 0.0042;
      player.pitch -= dy * 0.0042;
      player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch));
    }
  }
  e.preventDefault();
}, { passive: false });

function endTouch(e){
  for (const t of e.changedTouches){
    if (stick.active && t.identifier === stick.id){
      stick.active = false; stick.x = stick.y = 0;
      stickEl.style.opacity = '0';
      knobEl.style.transform = 'translate(0,0)';
    }
    if (look.active && t.identifier === look.id) look.active = false;
  }
}
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);

/* ============================================================
   10.  WALK / COLLIDE
   ============================================================ */
const tmp = new THREE.Vector3();
function updatePlayer(dt){
  let fwd = 0, str = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    fwd += 1;
  if (keys['KeyS'] || keys['ArrowDown'])  fwd -= 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  str -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) str += 1;
  if (stick.active){ fwd -= stick.y; str += stick.x; }

  const mag = Math.hypot(fwd, str);
  if (mag > 1){ fwd /= mag; str /= mag; }

  const run = (keys['ShiftLeft'] || keys['ShiftRight']) ? 2.0 : 1.0;
  const speed = 3.1 * run;

  const sinY = Math.sin(player.yaw), cosY = Math.cos(player.yaw);
  const wishX = (-sinY * fwd + cosY * str);
  const wishZ = (-cosY * fwd - sinY * str);

  const accel = 16;
  player.vel.x += (wishX * speed - player.vel.x) * Math.min(1, accel * dt);
  player.vel.z += (wishZ * speed - player.vel.z) * Math.min(1, accel * dt);

  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;

  // keep inside the room
  player.pos.x = Math.max(-BOUNDS.x, Math.min(BOUNDS.x, player.pos.x));
  player.pos.z = Math.max(-BOUNDS.z, Math.min(BOUNDS.z, player.pos.z));

  // push out of low-hanging caps
  const PR = 0.36;
  for (const c of colliders){
    const dx = player.pos.x - c.x, dz = player.pos.z - c.z;
    const d = Math.hypot(dx, dz), min = c.r + PR;
    if (d < min && d > 1e-4){
      const k = (min - d) / d;
      player.pos.x += dx * k;
      player.pos.z += dz * k;
    }
  }

  // head bob
  const moving = Math.hypot(player.vel.x, player.vel.z);
  player.bob += dt * moving * (run > 1 ? 2.3 : 1.9);
  const bobY = Math.sin(player.bob * 3.4) * 0.026 * Math.min(1, moving / 3);
  const bobX = Math.cos(player.bob * 1.7) * 0.020 * Math.min(1, moving / 3);

  camera.position.set(player.pos.x + bobX * cosY, player.eye + bobY, player.pos.z - bobX * sinY);
  camera.rotation.set(player.pitch, player.yaw + bobX * 0.02, Math.sin(player.bob * 1.7) * 0.004);
}

/* ============================================================
   11.  LOOP
   ============================================================ */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (state === 'playing') updatePlayer(dt);

  if (composer) composer.render();
  else renderer.render(scene, camera);
}

addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (composer) composer.setSize(w, h);
  if (bloomPass) bloomPass.resolution.set(w, h);
});

/* ============================================================
   12.  HUD COPY
   ============================================================ */
const keyRows = IS_TOUCH
  ? [['drag','look around'], ['stick','walk'], ['','hold to slow-walk under the caps']]
  : [['WASD','walk'], ['mouse','look'], ['shift','run'], ['R','return to start'], ['esc','release cursor']];
document.getElementById('keys').innerHTML = keyRows.map(([k, v]) =>
  `<div class="k">${k ? `<b>${k}</b>` : '<b>·</b>'}<span>${v}</span></div>`).join('');
if (IS_TOUCH){
  document.getElementById('tiny').textContent = 'Left thumb walks, right thumb looks.';
  document.getElementById('hint').textContent = 'look up — the whole ceiling is a forest';
}

// warm up, then reveal
requestAnimationFrame(() => {
  renderer.compile(scene, camera);
  setTimeout(() => document.getElementById('load').classList.add('gone'), 260);
});
requestAnimationFrame(frame);
</script>
